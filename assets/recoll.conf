
# Recoll configuration file
# Documentation: https://www.lesbonscomptes.com/recoll/usermanual/usermanual.html

# Top directories to index - can specify multiple with space separation
# topdirs = /documents
# topdirs = "/documents/Books - IT"
# topdirs = "/documents/Books - IT/Books - Python"
#
# All my text books
topdirs = "/documents/Books - *"

# Can also filter out with:
# skippedPaths = /documents/Comics /documents/Magazines /documents/UNSORTED

# Directory for the index data (xapian database)
# This should match the volume mount for the index
dbdir = /root/.recoll/xapiandb

# Follow symbolic links (0=no, 1=yes)
followLinks = 1

# Indexing depth limit (-1 for unlimited, useful for very deep hierarchies)
# depthmax = -1

# ========================================================================
# FILE TYPE CONFIGURATION
# ========================================================================

# Process these file types. For your use case (PDFs, EPUB, AZW):
# - PDF files are handled natively by recoll
# - EPUB files need the 'unzip' and 'xml' filters (usually built-in)
# - AZW/MOBI files (Kindle format) are supported via built-in filters

# Uncomment to limit indexing to specific types (otherwise indexes all known types):
# processedMimeTypes = application/pdf application/epub+zip application/x-mobipocket-ebook text/plain

# Exclude certain file patterns (adjust as needed)
skippedNames = *~ #* .git .svn CVS Cache cache* *.o *.pyc __pycache__

# ========================================================================
# PDF-SPECIFIC SETTINGS
# ========================================================================

# Maximum text size to extract from a single document (in MB)
# Increase this for large technical PDFs with lots of text
# Default is 20MB, but for technical docs you might want more
maxTextSize = 50

# Maximum file size to process (in MB)
# Files larger than this will be skipped entirely
maxFileSize = 500

# ========================================================================
# PERFORMANCE TUNING
# ========================================================================

# Number of indexing threads (0 = auto-detect cores)
# For 25K files, parallel processing helps significantly
idxthreads = 4

# Flush index to disk every N MB (lower = more frequent, safer but slower)
idxflushmb = 100

# Memory limit for indexing process (in MB)
# Increase for better performance with large collections
# This affects the Xapian database flushing behavior
idxmaxram = 512

# ========================================================================
# SEARCH BEHAVIOR
# ========================================================================

# Default operator for search terms: AND or OR
# AND = all terms must be present (more precise)
# OR = any term can be present (more results)
defaultSearchOperator = AND

# Maximum number of results to return in web interface
# For large collections, you might want to increase this
maxResultsForGui = 10000

# Enable stemming (word variations: run, running, runs all match)
# en = English, you can add other languages: en:fr:de
stemlanguages = en

# ========================================================================
# CHARACTER SET & LANGUAGE
# ========================================================================

# Default character set (usually utf-8 is correct)
defaultcharset = utf-8

# Aspell language for term expansion (optional, improves search)
# Requires aspell to be installed in the container
# aspellLanguage = en

# ========================================================================
# INDEXING SCHEDULE & MONITORING
# ========================================================================

# Monitor directories for changes and auto-reindex (0=disabled, seconds if enabled)
# We disable this since we use a scheduled task instead
# monitorindexvdelay = 0

# ========================================================================
# LOGGING
# ========================================================================

# Log level: 2=errors only, 3=info, 4=debug, 5=debug+
# Increase for troubleshooting indexing issues
loglevel = 2

# Log file location
# This will be created inside the container
logfilename = /root/.recoll/recoll.log

# ========================================================================
# ADVANCED OPTIONS FOR LARGE COLLECTIONS
# ========================================================================

# Index file contents only, skip some metadata (faster, smaller index)
# Uncomment if index size becomes a problem
# indexStripMarkup = 1

# Xapian database options
# noaspell = 1  # Disable aspell completely if you don't need fuzzy matching
# noDiacritics = 1  # Ignore accents and diacritics in searches

# ========================================================================
# WEB UI SPECIFIC
# ========================================================================

# These are read by the web interface
# You can also configure these in the web UI settings page

# URL prefix mapping - useful if you want to open files via HTTP instead of file://
# Example: Replace /documents with http://fileserver.example.com/docs
# [translations]
# /documents = http://fileserver.example.com/docs

